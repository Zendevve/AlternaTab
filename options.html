<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>AlternaTab Settings</title>
  <link rel="stylesheet" href="options.css">
</head>

<body>
  <div class="container">
    <h1>AlternaTab</h1>

    <div class="setting">
      <label>
        <input type="checkbox" id="crossWindow" checked>
        <span>Show tabs from all windows</span>
      </label>
    </div>

    <div class="actions">
      <button id="save">Save</button>
    </div>

    <p class="hint">Press Alt+Q to open tab switcher</p>
  </div>

  <script src="options.js"></script>
</body>

</html>
