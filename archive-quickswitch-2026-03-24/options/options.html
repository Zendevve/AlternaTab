<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickSwitch Options</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      max-width: 500px;
      margin: 0 auto;
      padding: 20px;
      line-height: 1.6;
      color: #333;
    }
    h1 {
      color: #2c3e50;
      border-bottom: 2px solid #3498db;
      padding-bottom: 10px;
    }
    .section {
      margin-bottom: 30px;
      padding: 20px;
      border: 1px solid #eee;
      border-radius: 8px;
      background-color: #fafafa;
    }
    .section h2 {
      color: #34495e;
      margin-top: 0;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
    }
    input[type="checkbox"] {
      margin-right: 8px;
    }
    input[type="number"], select {
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      width: 100px;
    }
    button {
      background-color: #3498db;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
      margin-right: 10px;
      margin-bottom: 10px;
    }
    button:hover {
      background-color: #2980b9;
    }
    button.secondary {
      background-color: #95a5a6;
    }
    button.secondary:hover {
      background-color: #7f8c8d;
    }
    .status {
      padding: 10px;
      border-radius: 4px;
      margin-top: 10px;
    }
    .status.success {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .status.error {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
  </style>
</head>
<body>
  <h1>QuickSwitch Options</h1>

  <div class="section">
    <h2>General Settings</h2>
    <label>
      <input type="checkbox" id="enableNotifications">
      Enable notifications
    </label>
    <label>
      <input type="checkbox" id="showRecentlyClosed">
      Show recently closed tabs
    </label>
    <label>
      <input type="checkbox" id="showTabGroups">
      Show tab groups
    </label>
    <label>
      <input type="checkbox" id="captureThumbnails">
      Capture tab thumbnails
    </label>
  </div>

  <div class="section">
    <h2>Appearance</h2>
    <label for="theme">Theme:</label>
    <select id="theme">
      <option value="auto">Auto (System)</option>
      <option value="dark">Dark</option>
      <option value="light">Light</option>
    </select>

    <label for="opacity">Overlay Opacity:</label>
    <input type="number" id="opacity" min="0.1" max="1" step="0.1" value="0.6">
  </div>

  <div class="section">
    <h2>Keyboard Shortcuts</h2>
    <p>Current shortcut: Alt+Q (configured in manifest)</p>
    <button id="resetShortcut" class="secondary">Reset to Default</button>
  </div>

  <div class="section">
    <h2>Data & Privacy</h2>
    <label>
      <input type="checkbox" id="analytics">
      Allow anonymous usage analytics
    </label>
    <label>
      <input type="checkbox" id="clearData">
      Clear all data on uninstall
    </label>
  </div>

  <div class="section">
    <h2>Actions</h2>
    <button id="saveBtn">Save Settings</button>
    <button id="resetBtn" class="secondary">Reset to Defaults</button>
    <button id="exportBtn" class="secondary">Export Settings</button>
    <button id="importBtn" class="secondary">Import Settings</button>
    <div id="status" class="status"></div>
  </div>

  <script src="options.js"></script>
</body>
</html>
