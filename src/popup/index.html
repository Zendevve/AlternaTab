<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>alternaTab Quick Controller</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
  </head>
  <body>
    <!-- Background subtle lights -->
    <div class="popup-bg-light"></div>

    <div class="popup-container">
      
      <!-- Popover Header -->
      <header class="popup-header">
        <div class="popup-logo-group">
          <div class="popup-logo">a</div>
          <div class="popup-title-wrap">
            <h2>alternaTab</h2>
            <span class="popup-status">
              <span class="status-dot"></span>
              Active Background Mode
            </span>
          </div>
        </div>
        <button id="openOptionsBtn" class="icon-btn-settings" title="Settings Dashboard">⚙️</button>
      </header>

      <!-- Active Metrics Segment -->
      <section class="metrics-section">
        <div class="metrics-row">
          <span class="metric-label">Tracked History</span>
          <span class="metric-badge" id="trackedCount">0 tabs</span>
        </div>
      </section>

      <!-- Quick Toggles Grid -->
      <section class="toggles-section">
        <h3>Quick Preferences</h3>
        
        <div class="toggle-control">
          <span class="toggle-name">Theme Style</span>
          <div class="btn-group-toggle" id="themeGroup">
            <button class="toggle-btn" data-value="light" title="Light Theme">☀️ Light</button>
            <button class="toggle-btn" data-value="dark" title="Dark Theme">🌙 Dark</button>
            <button class="toggle-btn" data-value="auto" title="System Match">💻 Auto</button>
          </div>
        </div>

        <div class="toggle-control">
          <span class="toggle-name">Card Layout</span>
          <div class="btn-group-toggle" id="layoutGroup">
            <button class="toggle-btn" data-value="grid" title="Grid Cells">田 Grid</button>
            <button class="toggle-btn" data-value="list" title="Vertical Rows">☰ List</button>
          </div>
        </div>
      </section>

      <!-- Hotkeys Launcher Card -->
      <footer class="popup-actions">
        <button id="openShortcutsBtn" class="action-link-btn">
          <span class="btn-icon">⌨️</span>
          <span>Configure Hotkey Shortcuts</span>
          <span class="btn-arrow-right">➔</span>
        </button>
      </footer>
    </div>

    <script type="module" src="index.ts"></script>
  </body>
</html>
